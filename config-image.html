<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu hình ảnh - Đầy đủ bộ lọc</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #1cb0f6; --success: #58cc02; --danger: #ff4b4b; --border: #e5e5e5; --text: #3c3c3c; }
        body { font-family: 'Be Vietnam Pro', sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        
        .search-box { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--border); outline: none; font-family: 'Be Vietnam Pro'; font-weight: 600; margin-bottom: 10px; box-sizing: border-box; }
        .topic-select { width: 100%; padding: 10px; border-radius: 12px; border: 2px solid var(--border); font-family: 'Be Vietnam Pro'; font-weight: 700; color: var(--text); margin-bottom: 10px; }
        
        .filter-bar { display: flex; gap: 5px; margin-bottom: 15px; background: #eee; padding: 4px; border-radius: 12px; }
        .filter-btn { flex: 1; padding: 10px 5px; border: none; border-radius: 10px; background: transparent; cursor: pointer; font-family: 'Be Vietnam Pro'; font-weight: 700; color: #666; font-size: 0.8rem; transition: 0.2s; }
        .filter-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .stats-bar { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; color: #888; margin-bottom: 10px; padding: 0 5px; }
        
        .vocab-list { max-height: 55vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 15px; background: #fafafa; }
        .vocab-item { display: flex; flex-direction: column; padding: 15px; margin: 8px; background: white; border-radius: 12px; gap: 10px; border: 1px solid #eee; transition: 0.2s; }
        .vocab-item:hover { border-color: var(--primary); }
        
        .vocab-info { display: flex; justify-content: space-between; align-items: flex-start; }
        .preview-img { width: 80px; height: 60px; object-fit: cover; border-radius: 8px; background: #eee; border: 1px solid #ddd; }
        
        .input-group { display: flex; gap: 8px; align-items: center; }
        .url-input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Be Vietnam Pro'; font-size: 0.9rem; }
        
        .btn-save { 
            width: 100%; background: var(--success); color: white; border: none; padding: 18px; border-radius: 15px; 
            font-family: 'Be Vietnam Pro', sans-serif; font-weight: 800; font-size: 1.1rem; cursor: pointer; 
            margin-top: 20px; border-bottom: 5px solid #46a302; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn-save:active { transform: translateY(2px); border-bottom-width: 2px; }
        
        .badge { font-size: 0.65rem; padding: 3px 8px; border-radius: 6px; font-weight: 800; margin-left: 5px; }
        .badge-topic { background: #e3f2fd; color: #1976d2; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h2 style="text-align: center; color: var(--primary); margin-top: 0;"><i class="fas fa-images"></i> QUẢN LÝ THƯ VIỆN ẢNH</h2>
    
    <input type="text" id="searchInput" class="search-box" placeholder="Tìm tên từ hoặc nghĩa..." oninput="renderList()">
    
    <select id="topicFilter" class="topic-select" onchange="renderList()">
        <option value="all">📁 Tất cả chủ đề</option>
    </select>

    <div class="filter-bar">
        <button class="filter-btn active" id="btn-all" onclick="setFilter('all')">TẤT CẢ</button>
        <button class="filter-btn" id="btn-none" onclick="setFilter('none')">CHƯA CÓ ẢNH</button>
        <button class="filter-btn" id="btn-has" onclick="setFilter('has')">ĐÃ CÓ ẢNH</button>
    </div>

    <div class="stats-bar" id="statsBar">
        <span>Kết quả: 0</span>
        <span style="color: var(--danger)">Thiếu: 0 ảnh</span>
    </div>

    <div id="vocabList" class="vocab-list"></div>

    <button class="btn-save" onclick="saveAll()">
        <i class="fas fa-cloud-upload-alt" style="margin-right:10px;"></i> <span>Cập nhật dữ liệu</span>
    </button>
</div>

<script>
    let vocabData = JSON.parse(localStorage.getItem("vocabData")) || [];
    let currentStatusFilter = 'all';

    function setFilter(type) { 
        currentStatusFilter = type; 
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + type).classList.add('active');
        renderList(); 
    }

    function updateTopicDropdown() {
        const select = document.getElementById("topicFilter");
        const topics = [...new Set(vocabData.map(v => v.topic || "Chung"))];
        select.innerHTML = '<option value="all">📁 Tất cả chủ đề</option>' + 
            topics.map(t => `<option value="${t}">📂 ${t}</option>`).join('');
    }

    function renderList() {
        const list = document.getElementById("vocabList");
        const search = document.getElementById("searchInput").value.toLowerCase();
        const selectedTopic = document.getElementById("topicFilter").value;

        // Logic lọc tổng hợp
        const filtered = vocabData.filter(item => {
            const matchesSearch = item.en.toLowerCase().includes(search) || item.vi.toLowerCase().includes(search);
            const matchesTopic = (selectedTopic === 'all' || item.topic === selectedTopic);
            const hasImg = (item.img && item.img.trim() !== "");
            
            let matchesStatus = true;
            if (currentStatusFilter === 'none') matchesStatus = !hasImg;
            if (currentStatusFilter === 'has') matchesStatus = hasImg;
            
            return matchesSearch && matchesTopic && matchesStatus;
        });

        // Cập nhật thống kê
        const missingCount = vocabData.filter(v => !v.img || v.img.trim() === "").length;
        document.getElementById("statsBar").innerHTML = `
            <span>Kết quả: ${filtered.length}</span>
            <span style="color: var(--danger)">Tổng thiếu: ${missingCount} ảnh</span>
        `;

        if(filtered.length === 0) {
            list.innerHTML = `<div style="text-align:center; padding:40px; color:#aaa;">Không có từ vựng nào khớp với bộ lọc.</div>`;
            return;
        }

        list.innerHTML = filtered.map(item => {
            const originalIndex = vocabData.indexOf(item);
            const hasImg = (item.img && item.img.trim() !== "");
            return `
            <div class="vocab-item">
                <div class="vocab-info">
                    <div>
                        <b style="font-size:1.1rem">${item.en}</b> 
                        <span class="badge badge-topic">${item.topic || 'Chung'}</span>
                        <div style="color:#666; margin-top:4px;">${item.vi}</div>
                    </div>
                    <img src="${item.img || ''}" class="preview-img" id="prev-${originalIndex}" onerror="this.src='https://placehold.co/80x60?text=Trống'">
                </div>
                <div class="input-group">
                    <input type="text" class="url-input" placeholder="Dán link ảnh tại đây..." 
                           value="${item.img || ''}" oninput="updatePreview(${originalIndex}, this.value)">
                    <button onclick="clearInput(${originalIndex})" style="background:none; border:none; color:#ccc; cursor:pointer; padding:5px;"><i class="fas fa-times-circle"></i></button>
                </div>
            </div>`;
        }).join('');
    }

    function updatePreview(idx, url) {
        vocabData[idx].img = url;
        const imgEl = document.getElementById(`prev-${idx}`);
        if(imgEl) imgEl.src = url || 'https://placehold.co/80x60?text=Trống';
    }

    function clearInput(idx) {
        vocabData[idx].img = "";
        renderList();
    }

    function saveAll() {
        if (vocabData.length === 0) return;
        localStorage.setItem("vocabData", JSON.stringify(vocabData));
        Swal.fire({
            title: 'THÀNH CÔNG!',
            text: 'Dữ liệu ảnh đã được cập nhật vào hệ thống.',
            icon: 'success',
            timer: 1500,
            showConfirmButton: false
        });
    }

    // Khởi tạo
    if(vocabData.length > 0) {
        updateTopicDropdown();
        renderList();
    } else {
        document.getElementById("vocabList").innerHTML = `<div style="text-align:center; padding:40px; color:var(--danger); font-weight:700;">Bạn chưa nạp file Excel vào trang Game!</div>`;
    }
</script>
</body>
</html>
